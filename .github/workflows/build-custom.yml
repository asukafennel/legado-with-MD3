                  'dWx0PSIuIikKICAgIGEgPSBhcC5wYXJzZV9hcmdzKCkKICAgIGFwcGx5KGEucm9vdCwgYS5zcmMpCgoKaWYgX19uYW1l'
                  'X18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo='
              ),
          }
          for name, value in FILES.items():
              (d / name).write_bytes(base64.b64decode(value))
              print('decoded', name, len(value), 'b64 chars')

          PY
          python3 /tmp/pgsrc/apply_patch.py --src /tmp/pgsrc --root .

      - name: Clean build inputs
        run: |
          echo "" > app/src/main/assets/18PlusList.txt
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}Debug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: lite-${{ github.run_number }}

      - name: Collect APK
        run: |
          find app/build/outputs/apk -name '*.apk' -print
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-lite-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
