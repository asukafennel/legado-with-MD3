      - name: Clean build inputs
        run: |
          echo "" > app/src/main/assets/18PlusList.txt
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}Debug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: pathgroup-${{ github.run_number }}

      - name: Collect APK
        run: |
          find app/build/outputs/apk -name '*.apk' -print
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-pathgroup-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
