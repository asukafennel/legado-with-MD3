name: 打包 · 按文件夹分组版

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'main'
      product:
        description: '产品变体（本地 TXT 选 appCore 即可）'
        required: true
        type: choice
        options:
          - appCore
          - appComic
        default: appCore

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ github.event.inputs.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

